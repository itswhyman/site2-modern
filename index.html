<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Studio</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="site-modern">

  <!-- SITE 2: Floating centered navbar (not full-bleed, inset from sides) -->
  <div class="nav-float-wrap">
    <header class="header header--float" id="header">
      <a href="#" class="logo" id="logo">AURA</a>
      <nav class="nav nav--pill">
        <a href="#hizmetler">Hizmetler</a>
        <a href="#galeri">Galeri</a>
        <a href="#hakkimizda">Hakkımızda</a>
        <a href="#yorumlar">Yorumlar</a>
        <a href="#iletisim">İletişim</a>
      </nav>
      <div class="header-actions">
        <a href="admin.html" class="admin-link" title="Admin">⚙</a>
        <a href="#iletisim" class="btn btn-sm" id="header-cta">Randevu</a>
      </div>
    </header>
  </div>

  <main>
    <section class="hero" id="hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="container hero-content">
        <div class="hero-badge">Yeni nesil güzellik stüdyosu</div>
        <h1 id="hero-title">Güzelliğini Yeniden Tanımla</h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="hero-actions">
          <a href="#iletisim" class="btn btn-primary" id="hero-cta">Hemen Randevu</a>
          <a href="#hizmetler" class="btn btn-outline">Hizmetleri Gör</a>
        </div>
      </div>
    </section>

    <section id="hizmetler" class="services">
      <div class="container">
        <div class="section-header">
          <span class="section-label">Hizmetler</span>
          <h2>İhtiyacına göre seç</h2>
        </div>
        <div class="services-grid" id="services-grid"></div>
      </div>
    </section>

    <section id="galeri" class="gallery">
      <div class="container">
        <div class="section-header">
          <span class="section-label">Galeri</span>
          <h2>Atmosfer</h2>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <section id="hakkimizda" class="about">
      <div class="container about-grid">
        <div class="about-text">
          <span class="section-label">Hakkımızda</span>
          <h2 id="about-title"></h2>
          <p id="about-text"></p>
          <ul class="about-features" id="about-features"></ul>
        </div>
        <div class="about-visual">
          <img id="about-img" src="" alt="Studio" class="about-img">
        </div>
      </div>
    </section>

    <section id="yorumlar" class="testimonials">
      <div class="container">
        <div class="section-header">
          <span class="section-label">Yorumlar</span>
          <h2>Onlar ne diyor?</h2>
        </div>
        <div class="testi-grid" id="testi-grid"></div>
      </div>
    </section>

    <section id="iletisim" class="contact">
      <div class="container">
        <div class="section-header">
          <span class="section-label">İletişim</span>
          <h2>Randevu & Danışmanlık</h2>
        </div>
        <div class="contact-grid">
          <div class="contact-info" id="contact-info"></div>
          <form class="contact-form" id="contact-form">
            <input type="text" name="name" placeholder="Ad Soyad" required>
            <input type="tel" name="phone" placeholder="Telefon" required>
            <select name="service" id="form-services"></select>
            <textarea name="message" rows="3" placeholder="Notunuz"></textarea>
            <button type="submit" class="btn btn-primary">Gönder</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo-text" id="footer-logo">AURA</span>
        <p id="footer-tagline"></p>
      </div>
      <div class="footer-social" id="footer-social"></div>
      <p class="footer-copy" id="footer-copy"></p>
    </div>
  </footer>

  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/public.js"></script>
</body>
</html>
